[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medresearch-cli"
version = "0.1.0"
description = "Local, review-first medical document and PubMed research workspace"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "typer>=0.12,<1", "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3", "httpx>=0.27,<1", "python-multipart>=0.0.18,<1",
  "pypdf>=5,<7", "pypdfium2>=4.30,<6", "Pillow>=11,<14",
  "pytesseract>=0.3.13,<1", "defusedxml>=0.7,<1", "filelock>=3.16,<4"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8,<1", "build>=1,<2"]

[project.scripts]
medresearch = "medresearch.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
